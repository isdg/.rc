# gpg-agent. Linked to ~/.gnupg/gpg-agent.conf by bootstrap (Darwin only --
# pinentry-program below is an absolute Homebrew path).
#
# Every option must be `name value` on ONE line. gpg-agent's parser does not
# continue onto the next line: a value left on its own line gives
#
#     gpg-agent.conf:2: missing argument
#     gpg-agent.conf:3: invalid option
#
# and the agent then refuses to start at all. What that looks like downstream is
# nothing about config -- `gpg: can't connect to the gpg-agent: IPC connect call
# failed`, `keydb_search failed: No agent running`, and finally `decryption
# failed: No secret key` on a key you very much do have.
default-cache-ttl 28800
max-cache-ttl 86400

# pinentry-mac, not pinentry-curses: the curses one needs a tty it can own, and
# is unusable from anything GUI-launched. Comes from the Brewfile; an absolute
# path here that does not exist is the other way to wedge the agent, so the two
# have to stay in step. On an Intel Mac this is /usr/local/bin/pinentry-mac.
pinentry-program /opt/homebrew/bin/pinentry-mac
