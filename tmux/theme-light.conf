# tmux light theme — GENERATED by theme/generate.sh.
# Edit theme/palette.sh, not this file.
#
# Sourced by .tmux.conf, which reads ~/.config/isg/theme at parse time (see the
# run-shell block there). Re-source ~/.tmux.conf to repaint; toggle_theme.sh
# does that for you, which is why tmux is the one tool that flips live.
#
# Every style keeps bg=default so the terminal background shows through and the
# status line reads as part of the pane instead of a band painted over it. Don't
# give these a background — it is what keeps the layout seamless.
set -g status-style "bg=default,fg=#555555"
set -g status-left "[#S]#{?#{==:#{client_key_table},plugins},#[fg=#000000#,bold]+#[default] ,#{?client_prefix,#[fg=#000000#,bold]*#[default] ,  }}"
set -g window-status-style "bg=default,fg=#777777"
set -g window-status-current-style "bg=default,fg=#000000,bold"
set -g status-left-style "bg=default,fg=#555555"
set -g status-right-style "bg=default,fg=#555555"
set -g message-style "bg=default,fg=#333333"
set -g pane-border-style "fg=#cccccc"
set -g pane-active-border-style "fg=#888888"
