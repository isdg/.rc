# --- omni keys ---
# omni.tmux binds nothing any more; every key it used to own is declared here, so
# this config holds every binding and a plugin update can't move a key under us.
# The capture family: j (colour) and J (plain). Lowercase is the one reached
# for without thinking, and that is the colour read; plain is the deliberate
# ask, so it takes the shifted key. There was a third — C-b C-b p, the
# same capture into `less` — dropped for never being reached for: nvim is where
# the text is wanted, and the layer's p buys the push/pull sub-table in
# 10-layer.conf instead. No unbind needed for it, unlike the E/O removals
# elsewhere: p is rebound there, and the Cyrillic з russian.sh twinned from it
# follows whatever p holds when the sweep runs.
# Still after tpm and before russian.sh: not to win an override any more, but so
# the Cyrillic sweep runs once these exist.
# $OMNI is resolved the way omni.tmux did it — .tmux.conf cannot see that var,
# and the plugin still owns the self-heal build that puts the binary there.
run-shell 'OMNI="$(command -v omni || echo "$HOME/.cargo/bin/omni")"; \
  tmux bind-key b display-popup -E -w 100% -h 100% "$OMNI windows"; \
  tmux bind-key w display-popup -E -w 100% -h 100% "$OMNI windows --session"; \
  tmux bind-key a display-popup -E -w 100% -h 100% "$OMNI content"; \
  tmux bind-key A display-popup -E -w 100% -h 100% "$OMNI content --all"; \
  tmux bind-key j run-shell -b "$OMNI capture --pager nvim"; \
  tmux bind-key J run-shell -b "$OMNI capture --pager plain"'
# -b on both: a bare run-shell holds the client that pressed the key until the
# command returns, and capture reads the whole history — 100k lines here — so
# the prefix went dead for as long as that took. Nothing waits on the result.

# Where a capture lands, read by omni itself: float lays it over the pane as a
# tmux 3.8 floating pane, so the prefix stays live and nothing moves; pane swaps
# it into the slot of the pane the text came from and swaps back on quit (the
# fallback before 3.8); on is the same view as a popup, which holds every key
# until it closes; off is omni's own new window. P promotes any of them to a
# window at the line being read.
#   tmux set -g @capture-overlay on     (live, no re-source)
%if "#{switch-mode-match-style}"
set -g @capture-overlay float
%else
set -g @capture-overlay pane
%endif

# The session-scoped jump moved B -> w, and the choose-tree window chooser w
# stepped up to W. B now opens switch-mode (02-keys.conf).

# Stamp each window as it is looked at, for prefix b's `visited` order (ctrl-g).
# @seq is a global ticket counter, @seen the ticket that window last drew, so
# the highest @seen is the window you were on most recently.
#
# This is the thing #{window_activity} is not: it times OUTPUT, so a pane running
# claude or k9s restamps itself every second and outranks the window you were
# reading. Attention has to be recorded when it happens, and only a hook can.
#
# -F is what makes `set` expand the format instead of storing it verbatim; two
# commands in one hook run in order, so @seen reads the ticket just drawn. No
# shell anywhere — tmux does its own arithmetic, so a window switch spawns
# nothing and the stamps live and die with the windows they are on.
#
# session-window-changed covers any move inside a session (choosers, new-window,
# a kill's landing, not just select-window); client-session-changed covers
# crossing sessions, including a switch-client onto an already-current window.
set-hook -gu after-select-window
set-hook -g session-window-changed \
  'set -gF @seq "#{e|+:#{@seq},1}" ; set -wF @seen "#{@seq}"'
set-hook -g client-session-changed 'set -gF @seq "#{e|+:#{@seq},1}" ; set -wF @seen "#{@seq}"'
