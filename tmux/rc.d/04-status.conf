# Prefix indicator: a bold * is appended after the session name's ] while tmux
# waits for the next key; it eats one trailing space so the list never shifts.
# default status-left-length is 10, which truncates longer session names; raise
# it so the gap before window 1 survives (not theme-dependent, kept here).
set -g status-left-length 40
# Right side: keep tmux's default pane-title display, only swap the date to
# ISO style (matches nvim <leader>nt, without seconds). status-left is untouched.
#
# Alerts lead: the flagged window indexes, each carrying its reason — ~ silence,
# # activity, ! bell. One fixed spot beats hunting the window list for a
# differently styled entry, and it is the only place the three reasons are told
# apart at all, since tmux paints one style for any of them.
#
# #{session_alerts} would do most of this, and is not used, for two reasons. It
# only ever describes the session you are looking at — a build finishing in
# cosmos-main is invisible from misc, which with ten sessions is most of the
# time. And its symbols are tmux's to choose: # for activity, where * reads
# better against the ~ that means stopped.
#
# So the sweep is built by hand: #{S:} loops every session on the server and
# #{W:} loops that session's windows inside it (which nests, verified), leaving
# the symbols ours. Silence supersedes activity deliberately — both flags stay
# set once raised, and a window that has stopped should say ~ rather than
# reporting the burst that preceded it.
#
# Kept in a user option because three places want it (here twice, and the
# C-b C-b A overview), the same reason @choose-alt-keys is one; #{E:} pulls the
# text out and evaluates the loops inside it.
#
# Truncated at 28 columns and the length raised to 90: status-right truncates
# from the RIGHT, so an unbounded sweep would eat the clock rather than itself.
# Empty when nothing is flagged, so the separator hangs off the conditional
# instead of sitting there always.
set -g @alert-sweep "#{S:#{W:#{?window_silence_flag,#{session_name}:#{window_index}~  ,#{?window_activity_flag,#{session_name}:#{window_index}*  ,}}#{?window_bell_flag,#{session_name}:#{window_index}!  ,}}}"
set -g status-right-length 90
set -g status-right "#{?#{E:@alert-sweep},#{=28:#{E:@alert-sweep}}· ,}\"#{=21:pane_title}\" isg %Y-%m-%d %H:%M %z"
set -g status-interval 5
# Window list: current window marked *, last-chosen window (prefix l) marked ~.
# @capture is set on the window for as long as a capture popup is open over one
# of its panes (tmux/capture.sh). The name is reversed rather than replaced, so
# it goes on saying what is running while the block says you are looking at a
# snapshot of it rather than at it.
# reverse, not bold: a capture always covers the current window, and the current
# window is bold already (window-status-current-style), so bold reads as nothing.
set -g window-status-current-format "#I:#{?@capture,#[reverse]#W#[default],#W}*"
set -g window-status-format         "#I:#{?@capture,#[reverse]#W#[default],#W}#{?window_last_flag,~,}"
