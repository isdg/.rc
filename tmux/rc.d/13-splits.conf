# Splits hang off s, one level deeper: C-b C-b s v is side-by-side, C-b C-b s h
# is stacked. A third table rather than a two-key binding, because tmux keys are
# single keys — a sequence IS a table. This keeps vim's split names without
# spending any top-level key, which is why prefix v / prefix h are gone; the
# defaults % and " are untouched for the one-handed case.
# The flags read inverted against the letters and that is not a typo: tmux's
# -h/-v name the axis the split cuts along, vim's :vsplit/:split name the
# divider, so v (side-by-side, vertical divider) is -h and h (stacked) is -v.
bind -T plugins s switch-client -T splits
bind -T splits v split-right
bind -T splits h split-down
