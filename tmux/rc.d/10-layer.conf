# --- second layer: prefix prefix ---
# C-b C-b enters the `plugins` key table — a second layer whose plain letters run
# the plugin entry points, keeping them out of the crowded top level.
#
# Alt was the alternative and it loses twice: in the root table apps rewrite it
# (nvim/readline/fzf all claim M-o and M-j), and in the prefix table it works but
# is invisible — tmux only learns a modifier once a whole key arrives, so there
# is no "prefix + Alt held" state to render. A key table is durable state, so
# #{client_key_table} drives the `+` in status-left the way client_prefix drives
# the `*`. That is the whole reason this shape was chosen.
#
# The key spent is send-prefix (a literal C-b for a nested tmux over SSH), so it
# moves inside the layer: C-b C-b C-b sends it.
bind C-b switch-client -T plugins
bind -T plugins C-b send-prefix

# C-a is a second prefix with the same layer; C-a C-a C-a sends a literal C-a.
set -g prefix2 C-a
bind C-a switch-client -T plugins
bind -T plugins C-a send-prefix -2

# Pane navigation lives here, as plain vim hjkl. Lowercase is only possible
# because the layer has its own namespace: at the top level h is a stacked
# split, j is omni's capture, l is last-window and k is unbound.
# These deliberately do NOT re-enter the table. You almost always hop in order
# to type in the pane you land on, and a sticky hop eats that first keystroke:
# tmux would still own the keyboard, and the key that finally exits the table is
# consumed doing so rather than reaching nvim. One hop, then out.
# Walking several panes is what the default prefix arrows are for — they carry
# -r, so C-b Up Up Up repeats inside repeat-time.
bind -T plugins h select-pane -L
bind -T plugins j select-pane -D
bind -T plugins k select-pane -U
bind -T plugins l select-pane -R

# The same hop by number, for when the target is not one step away. These are
# the indexes prefix q paints on the panes, starting at 1 (pane-base-index), and
# they are here rather than at the top level because prefix 1-9 is window
# select — a tmux idiom older than this file and not worth spending.
# Non-sticky like hjkl above, and for the same reason: you jump in order to type.
bind -T plugins 1 select-pane -t 1
bind -T plugins 2 select-pane -t 2
bind -T plugins 3 select-pane -t 3
bind -T plugins 4 select-pane -t 4
bind -T plugins 5 select-pane -t 5
bind -T plugins 6 select-pane -t 6
bind -T plugins 7 select-pane -t 7
bind -T plugins 8 select-pane -t 8
bind -T plugins 9 select-pane -t 9

# Resize is where staying in the table earns its keep: it is inherently
# repetitive, and you are not trying to type afterwards. Capitals, so the shift
# key reads as "change the pane" against lowercase "go to the pane", and each
# one re-enters so H H H keeps pulling the border. Escape or q drops out; any
# unbound key also exits, but is swallowed doing it, so the explicit pair is
# what keeps that from being a surprise.
# One column/row per press: staying in the table is what makes a step of 1
# practical, since holding the key walks the border smoothly instead of
# jumping in fives. prefix M-arrow keeps the coarse 5 for a single big nudge.
bind -T plugins H resize-pane -L \; switch-client -T plugins
bind -T plugins J resize-pane -D \; switch-client -T plugins
bind -T plugins K resize-pane -U \; switch-client -T plugins
bind -T plugins L resize-pane -R \; switch-client -T plugins

# E undoes all of the above, so it belongs with them rather than at the top
# level where it started: HJKL is the whole reason you need an equalize, and
# reaching it used to mean leaving the table and pressing the prefix again.
# Re-enters for the same reason the resize keys do — E is most often the first
# press of a fresh round of HJKL, not the last press of the old one.
# Its old home, prefix E, is unbound just below; У goes with it, since
# russian.sh twins whatever is bound when it runs and cannot remove what a
# server bound before this moved (the same reason prefix Щ is spelt out).
bind -T plugins E select-layout -E \; switch-client -T plugins
unbind E
unbind У

# Third tier on the same letters: move the pane itself rather than the focus or
# the border. C-hjkl, so the whole family reads down one column — h goes to a
# pane, H grows toward it, C-h drags the pane there.
#
# tmux has no "move pane" verb; swap-pane is the entire vocabulary, and a swap
# leaves the active pane pinned to the old *position*, now holding whatever was
# swapped in. So the pane you meant to move slides out from under you and you
# are suddenly driving its neighbour. The select-pane is what turns the swap
# back into a move: it runs before anything has moved the cursor, so {left-of}
# still resolves from the unchanged position and now names the pane that just
# travelled there. Both halves must use the same direction word for that to hold.
#
# Directional targets wrap at the edges (tmux's own behaviour, same as
# select-pane -L), so pushing left from the leftmost pane sends it to the far
# right instead of erroring — which is exactly the swap you want in a 2-pane
# split, and harmless anywhere else since one press the other way undoes it.
# Re-enters the table like the resize keys: a pane rarely lands in one press.
bind -T plugins C-h swap-pane -t '{left-of}'  \; select-pane -t '{left-of}'  \; switch-client -T plugins
bind -T plugins C-j swap-pane -t '{down-of}'  \; select-pane -t '{down-of}'  \; switch-client -T plugins
bind -T plugins C-k swap-pane -t '{up-of}'    \; select-pane -t '{up-of}'    \; switch-client -T plugins
bind -T plugins C-l swap-pane -t '{right-of}' \; select-pane -t '{right-of}' \; switch-client -T plugins

# C-b C-b p s / p l: move a pane across windows or sessions — push it away, or
# pull one here — choosing the other end from a picker instead of aiming at it.
#
# The C-h/C-j/C-k/C-l keys above only shuffle panes inside one window. Crossing
# a window or session boundary is join-pane, which needs a target — and
# choose-tree supplies one: given a trailing template it substitutes the chosen
# item for %%, so the tree already used for navigation doubles as a target
# picker. The alternative tmux offers is select-pane -m plus manual navigation,
# which is worth it only when you want to stage a move for later; for "this one,
# there, now" the picker settles it in one M-<letter> press.
#
# p is a sub-table, the way s is for splits, and for the same reason: tmux keys
# are single keys, so a sequence IS a table. The pair used to be m and M, where
# the shift key was the only thing telling a push from a pull — two opposite
# moves one modifier apart, on the letter tmux's own vocabulary spends on marking
# a pane. Spelling them pu-s-h and pu-l-l puts the direction in the keystroke and
# costs the layer one key rather than two, since the second letter lives in its
# own namespace.
#
# The old m/M are not unbound here, nor the Cyrillic ь/Ь russian.sh twinned from
# them. A re-source rebinds what this file lists but cannot drop what it no
# longer mentions, so on a server started before this change all four survive
# until they are cleared by hand:
#
#     tmux unbind -T plugins m ; tmux unbind -T plugins M
#     tmux unbind -T plugins ь ; tmux unbind -T plugins Ь
#
# A fresh server is unaffected — it never learns them.
#
# Both show the whole tree — neither -s nor -w — because what you pick decides
# what happens. There is no flag for "panes": they are what is left visible when
# nothing is collapsed.
#
# l pulls: the pane you pick comes here as a split.
#
# s pushes, and splitting is only right when you aimed at a pane. Aim at a
# window or a session and you meant "put it over there", not "wedge it into
# whatever is open there" — so those break it out into a new window instead.
# The three targets are told apart by the shape choose-tree substitutes:
#   session  =beta:           window  =alpha:2.         pane  =alpha:2.%2
# so "ends with .%something" is the pane test, and everything else is a
# container. %1 rather than %% for the substitution: %% replaces only its FIRST
# occurrence, %1 replaces every one, and the template names the target three
# times. The %* in the pattern is left alone, being neither token.
#
# break-pane needs -a: against a window target plain -t fails with "index in
# use", since the index is taken by the window you just pointed at. -a puts the
# new window after it, and is accepted for a session target too, so one branch
# covers both. -d leaves you where you are, matching join-pane -t — a push
# sends the pane away, it does not take you along.
#
# Neither re-enters the table: the move is one action, unlike a resize.
# Deliberately not command-aliased — the aliases in 01-aliases.conf each
# stand in for three or four copies, and these are one use apiece.
bind -T plugins p switch-client -T moves
bind -T moves l choose-tree -Z -O name -K "#{E:@choose-alt-keys}" "join-pane -s '%%'"
bind -T moves s choose-tree -Z -O name -K "#{E:@choose-alt-keys}" \
  "if-shell -F '#{m:*.%*,%1}' { join-pane -t '%1' } { break-pane -d -a -t '%1' }"

bind -T plugins Escape switch-client -T root
bind -T plugins q switch-client -T root
