# C-b C-b w: write this pane's scrollback to a file.
#
# The sibling of prefix j/J, which show the same text in nvim: this one leaves it
# on disk, for when the pane is about to be killed, or the output has to outlive
# the session, or something else wants to read it.
#
# capture-pane, not pipe-pane. pipe-pane tees the live stream, which sounds
# better and is not: it records raw bytes, so with zsh-syntax-highlighting every
# keystroke lands in the file as a repaint (^[[1m^[[31mp^[[1m^[[31mr… for one
# typed word) and the real output drowns. capture-pane hands over the rendered
# text instead. The cost is symmetric: pipe-pane catches everything from the
# moment it is armed, capture-pane only what history-limit still holds — 100k
# lines here, which is the larger number in every case worth caring about.
#
# -S - takes the whole history, not the visible screen. -J unwraps lines the
# terminal folded, so grepping the file finds strings the eye can see. No -e:
# colour would mean escape codes back in the file, which is the thing being
# avoided — prefix J is where colour belongs.
#
# The name is sanitised because window names hold anything automatic-rename
# puts there, and "nvim:init.lua" has a colon in it.
bind -T plugins w run-shell 'd="${XDG_CACHE_HOME:-$HOME/.cache}/tmux-panes"; mkdir -p "$d"; \
  n=$(printf "%s" "#{session_name}-#{window_name}-#{pane_index}" | tr -c "A-Za-z0-9._-" "_"); \
  f="$d/$n-$(date +%Y%m%d-%H%M%S).txt"; \
  tmux capture-pane -p -S - -J -t "#{pane_id}" > "$f"; \
  tmux display-message "saved $n ($(wc -l < "$f" | tr -d " ") lines) -> ${d/#$HOME/~}"'
