# --- command aliases ---
# Names for the command shapes this config repeats, so a change lands in one
# place. command-alias is an array with six built-in entries at 0-5
# (split-pane=split-window, splitp, server-info=…) — start at 100 or you
# overwrite them. From a shell the subscript needs quoting (set -s
# 'command-alias[100]' …) or zsh globs it; inside this file it does not.
#
# These expand when a binding is *created*, not when it runs: list-keys shows
# the full command afterwards, and editing an alias later does not reach
# bindings already made. So this is one place to edit in the source, not
# runtime indirection — unlike @choose-alt-keys in 02-keys.conf, which #{E:}
# re-evaluates per row every time a chooser opens.
#
# Named by where the new pane lands, deliberately: tmux's -h/-v name the axis
# the split cuts and vim's :vsplit/:split name the divider, so the letters read
# inverted (see 13-splits.conf). "right" and "down" cannot.
set -s command-alias[100] 'split-right=split-window -h -c "#{pane_current_path}"'
set -s command-alias[101] 'split-down=split-window -v -c "#{pane_current_path}"'
set -s command-alias[102] 'sessions=choose-tree -Zs -O name -K "#{E:@choose-alt-keys}"'
set -s command-alias[103] 'windows=choose-tree -Zw -O name -K "#{E:@choose-alt-keys}"'
