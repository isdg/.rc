# C-b C-b a: arm this window's alert. Again to disarm.
# C-b C-b A: what is flagged anywhere, on demand.
#
# One arming covers the whole life of whatever you just launched, because both
# monitors go on together and report opposite things. monitor-activity raises a
# flag on the first byte of output, monitor-silence once 45s pass with none — so
# the window says * while it is running and ~ once it has stopped, which is the
# two facts worth having about a build you walked away from.
#
# The hooks make each fire once and disarm itself, so an arming spends exactly
# one * and one ~ rather than flapping for the rest of the session. Without them
# the flags return on every later burst or lull, since selecting a window clears
# a flag but does not stop the timer. They take no -t: a hook already runs with
# the firing window as its target, and -t "#{hook_window}" silently does nothing
# there (the format is not expanded).
#
# 45s clears the pauses a real build contains — linking, a slow test — where 30
# trips on them. Both monitors are output-based, so neither knows whether
# anything succeeded: a job computing silently reads as finished, a spinner
# reads as busy forever.
#
# The one-shot is a convenience, not a guarantee. activity-action and
# silence-action are both `other`, which suppresses the alert *action* for a
# window that is its own session's current window. The flag is still set, so the
# sweep shows it, but the hook rides on the action:
#
#   window NOT current -> flag set, alert fires, hook disarms it
#   window IS  current -> flag set, no alert, still armed
#
# Which matches the intended use: arm it and leave. Arming the window you are
# typing in raises activity at once anyway, your own echo being output.
#
# Three signals arrive and only one needed configuring: the window's entry in
# the list restyles (window-status-activity-style, set per theme — tmux defaults
# it to reverse video, which looks like a glitch on this bar), the window shows
# up in the status-right sweep with its symbol, and the BEL reaches Ghostty,
# whose bell-features = attention,title bounces the dock and marks the title.
# That last is why this reaches you when Ghostty is not the focused app.
set-hook -g alert-silence  'setw monitor-silence 0'
set-hook -g alert-activity 'setw monitor-activity off'
bind -T plugins a if-shell -F "#{||:#{monitor-activity},#{!=:#{monitor-silence},0}}" {
    setw monitor-activity off
    setw monitor-silence 0
    display-message "alert: off"
  } {
    setw monitor-activity on
    setw monitor-silence 45
    display-message "alert: on — * running, ~ stopped"
  }

# A asks what the bar answers passively, unclipped and selectable: `omni windows
# --alerts` is prefix b's picker narrowed to windows carrying an alarm, each row
# led by its state — [!] bell, [~] stopped, [*] running, [.] armed but silent so
# far. It inherits the whole picker: aligned columns, the peek preview that knows
# an alternate-screen TUI from a shell, ctrl-x kill, ctrl-j capture, ctrl-g order.
#
# This began as tmux/alerts.sh and moved into omni, where prefix b already had
# every part of it — the shell version was reimplementing align_columns in awk
# and previewing with `capture-pane | tail`, which shows blank space for k9s or
# nvim. [.] is the one state neither the status bar nor prefix b can show: it is
# an inference from the monitor options, not a tmux flag, so there is nothing for
# the bar's styling to hook onto and an armed window looks unarmed there.
run-shell 'OMNI="$(command -v omni || echo "$HOME/.cargo/bin/omni")"; \
  tmux bind-key -T plugins A display-popup -E -w 100% -h 100% "$OMNI windows --alerts"'
