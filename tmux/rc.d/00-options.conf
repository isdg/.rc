set -g mouse on
set -g history-limit 100000

# Truecolor passthrough: without this tmux quantizes 24-bit color to its
# 256-palette, shifting vim/bat hex colors (most visible in fzf previews).
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# Let escape sequences reach the outer terminal instead of tmux answering them
# itself. Needed for terminal background-colour detection: CLIs like gh/glamour
# query OSC 11 to pick a light/dark theme; with passthrough off tmux replies with
# its own (dark) default, so gh renders dark in a light terminal. On = the query
# reaches Ghostty and auto-detection works (also enables image protocols).
set -g allow-passthrough on

# Forward the terminal's focus in/out (CSI I / CSI O) to the pane instead of
# swallowing them. Off is tmux's default, which leaves anything asking "is the
# user looking at me" guessing: nvim's FocusGained (hence :checktime autoread)
# never fires, and Claude Code warns about it outright. Our own alert rig has
# the same blind spot — activity-action/silence-action `other` treat "current
# window" as "you are watching", which is wrong whenever Ghostty itself is in
# the background, the very case the bell exists to cover.
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Auto window names: bare command by default, but append the open file ONLY for
# (n)vim, so buffers are distinguishable (nvim:init.lua, nvim:.tmux.conf) while
# shells etc. stay bare (zsh, claude). nvim publishes its current filename as
# the pane title (set title + titlestring=%t, see nvim/rc.d/00-options.lua),
# which tmux reads as #{pane_title}. #{m:*vim,...} matches vim/nvim/gvim;
# #{?cond,then,else} picks.
setw -g automatic-rename-format '#{pane_current_command}#{?#{m:*vim,#{pane_current_command}},:#{pane_title},}'

setw -g mode-keys vi
set -g set-clipboard on
# Advertise OSC 52 clipboard support for every terminal so tmux emits it on
# copy (Ghostty handles it locally and over SSH). Without this tmux won't send
# OSC 52 unless the attached terminal's terminfo declares the Ms capability.
set -as terminal-features ',*:clipboard'
