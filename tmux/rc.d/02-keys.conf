bind & if-shell -F "#{==:#{window_index},1}" \
  "kill-window" \
  "select-window -t :- ; kill-window -t :+"
bind x kill-pane
bind X confirm-before -p "kill session #S? (y/n)" kill-session

bind '"' split-down
bind % split-right
bind c new-window -a -c "#{pane_current_path}"
bind C command-prompt -p "new session name:" "new-session -s '%%' -c '~'"

bind n previous-window
bind p next-window

# prefix z: zen mode — hide the status bar for a distraction-free pane; prefix z
# again brings it back. `set -g status` with no value toggles the flag (tmux
# omits the value for boolean options). status is a session option, so zen
# applies to every window of the session, and it survives a theme re-source
# because .tmux.conf never sets `status` itself — only its styles.
# Zoom moves off z to Z, since zen wants the shorter key.
bind z set -g status
bind Z resize-pane -Z

# prefix r / prefix R: rename window / pane title. `r` is a shorter alias for the
# default `,` (rename-window); it turns off automatic-rename for that window so
# the manual name sticks. `R` sets pane_title, which feeds automatic-rename-format
# and status-right. Both prefill the current name so it's an edit, not a retype.
# For (n)vim panes the editor keeps rewriting pane_title, so `R` is most useful
# for shells/REPLs.
bind r command-prompt -I "#{window_name}" -p "window name:" "rename-window '%%'"
bind R command-prompt -I "#{pane_title}" -p "pane title:" "select-pane -T '%%'"

# prefix s / prefix W: choose-tree with Alt-letter fast-access. -K maps #{line}
# (0-based row) to M-a..M-z, then M-A..M-Z past 26 (52 total). Using the Alt
# modifier means zero clashes: plain h/j/k/l still navigate and x/f/m/n/t/etc
# stay as choose-tree commands, while M-<letter> jumps straight to an item.
# -O name sorts sessions/windows alphabetically by default (vs index); toggle
# in-mode with O, reverse with r.
# No -N anywhere: the flag means "start without the preview", and *given twice*
# means the larger one — prefix s used to carry -NN and so opened with the big
# preview while prefix W opened with the small one. Bare is tmux's default, the
# small preview, and now both agree. v still toggles it per invocation.
# The -K format lives in a user option so the three bindings below share one
# copy. #{E:} expands it twice: once to pull the option's text out, once to
# evaluate the #{line} arithmetic per row while the chooser is open.
set -g @choose-alt-keys "#{?#{e|<:#{line},26},M-#{a:#{e|+:#{line},97}},#{?#{e|<:#{line},52},M-#{a:#{e|+:#{line},39}},}}"
bind s sessions
bind W windows

# Click the session name in the status line for the same session chooser as
# prefix s — status-left is the [#S] label, so the click target is exactly it.
# MouseDown1StatusLeft is unbound by default; right-click there keeps tmux's
# built-in session menu (MouseDown3StatusLeft), which this leaves alone.
bind -n MouseDown1StatusLeft sessions
