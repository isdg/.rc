# copy-selection (no pipe) + set-clipboard on => tmux emits OSC 52 to the
# outer terminal, so the selection lands in the *local* Mac clipboard whether
# tmux runs locally or on a remote SSH host. No pbcopy/xclip needed.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi Enter send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# --- scrollback: homerow, always the ACTIVE pane ---
# The wheel cannot do this. tmux resolves mouse keys against the pane under the
# *pointer*, so in a split it scrolls whichever pane the mouse is parked over
# rather than the one you are typing in — and nothing at all when the pointer
# sits outside the window. Every key below targets the active pane instead:
# copy-mode and `send -X` default to it, and no pointer is consulted.
#
# prefix e enters copy-mode already scrolled to the bottom, a one-handed alias
# for the default prefix [ which stays bound. -e is what makes it a *scroll*
# affordance rather than a *copy* one: scrolling back down past the last line
# drops you out to the shell, so reading a few screens back costs e, some k,
# some j — and never a q.
bind e copy-mode -e

# Half-page on bare d/u, matching vim's C-d/C-u without the reach. Both letters
# were unbound in copy-mode-vi (only the Ctrl pair existed), so this adds keys
# without taking any: j/k stay cursor motion, which is what a selection needs
# (v then j), and J/K + C-e/C-y remain the line-at-a-time view scrolls.
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi u send -X halfpage-up
