# --- orchbus keys ---
# Same deal as omni: orchbus.tmux binds nothing, the keys are declared here.
# o opens the cockpit as an ephemeral popup, O as a window that persists — at the
# top level, alongside omni's b/a/A/j/J, because the two are reached for the same
# way and equally often; splitting the pair across layers was the one thing you
# had to stop and remember.
#
# What they displace, tmux's own prefix o (cycle to the next pane), goes into the
# layer, where hjkl already are: pane navigation is what that half of the table
# is for, and cycling is the same errand by another name.
#
# The two unbinds clear the O this section used to put in the layer, and the Щ
# russian.sh twinned from it: a re-source rebinds what is listed here but cannot
# drop what is not, so on a server that has been running since before this swap
# both would survive as a second way into the cockpit. The Cyrillic key is spelt
# out rather than swept because it is the one twin whose source is gone — every
# other one still follows its Latin key automatically.
run-shell 'ORCHBUS="$(command -v orchbus || echo "$HOME/.cargo/bin/orchbus")"; \
  tmux bind-key o display-popup -E -w 100% -h 100% "$ORCHBUS ui"; \
  tmux bind-key O run-shell "$ORCHBUS open"'
bind -T plugins o select-pane -t :.+
unbind -T plugins O
unbind -T plugins Щ
