set -g mouse on
set -g history-limit 100000

# Truecolor passthrough: without this tmux quantizes 24-bit color to its
# 256-palette, shifting vim/bat hex colors (most visible in fzf previews).
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# Let escape sequences reach the outer terminal instead of tmux answering them
# itself. Needed for terminal background-colour detection: CLIs like gh/glamour
# query OSC 11 to pick a light/dark theme; with passthrough off tmux replies with
# its own (dark) default, so gh renders dark in a light terminal. On = the query
# reaches Ghostty and auto-detection works (also enables image protocols).
set -g allow-passthrough on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Auto window names: bare command by default, but append the open file ONLY for
# (n)vim, so buffers are distinguishable (nvim:init.lua, nvim:.tmux.conf) while
# shells etc. stay bare (zsh, claude). nvim publishes its current filename as the
# pane title (set title + titlestring=%t, see nvim options.lua), which tmux reads
# as #{pane_title}. #{m:*vim,...} matches vim/nvim/gvim; #{?cond,then,else} picks.
setw -g automatic-rename-format '#{pane_current_command}#{?#{m:*vim,#{pane_current_command}},:#{pane_title},}'

setw -g mode-keys vi
set -g set-clipboard on
# Advertise OSC 52 clipboard support for every terminal so tmux emits it on
# copy (Ghostty handles it locally and over SSH). Without this tmux won't send
# OSC 52 unless the attached terminal's terminfo declares the Ms capability.
set -as terminal-features ',*:clipboard'

bind & if-shell -F "#{==:#{window_index},1}" \
  "kill-window" \
  "select-window -t :- ; kill-window -t :+"
bind x kill-pane
bind X confirm-before -p "kill session #S? (y/n)" kill-session

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
# prefix v / prefix h: the same two splits under vim's names, kept alongside the
# default " and % rather than replacing them. The flags look inverted against
# the letters and that is not a typo: tmux's -h/-v name the axis the split cuts
# along, vim's :vsplit/:split name the divider, so v (side-by-side, vertical
# divider) is -h and h (stacked) is -v.
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind c new-window -a -c "#{pane_current_path}"
bind C command-prompt -p "new session name:" "new-session -s '%%' -c '~'"

bind n previous-window
bind p next-window

# prefix z: zen mode — hide the status bar for a distraction-free pane; prefix z
# again brings it back. `set -g status` with no value toggles the flag (tmux
# omits the value for boolean options). status is a session option, so zen
# applies to every window of the session, and it survives a theme re-source
# because .tmux.conf never sets `status` itself — only its styles.
# Zoom moves off z to Z, since zen wants the shorter key.
bind z set -g status
bind Z resize-pane -Z

# prefix r / prefix R: rename window / pane title. `r` is a shorter alias for the
# default `,` (rename-window); it turns off automatic-rename for that window so
# the manual name sticks. `R` sets pane_title, which feeds automatic-rename-format
# and status-right. Both prefill the current name so it's an edit, not a retype.
# For (n)vim panes the editor keeps rewriting pane_title, so `R` is most useful
# for shells/REPLs.
bind r command-prompt -I "#{window_name}" -p "window name:" "rename-window '%%'"
bind R command-prompt -I "#{pane_title}" -p "pane title:" "select-pane -T '%%'"

# prefix s / prefix w: choose-tree with Alt-letter fast-access. -K maps #{line}
# (0-based row) to M-a..M-z, then M-A..M-Z past 26 (52 total). Using the Alt
# modifier means zero clashes: plain h/j/k/l still navigate and x/f/m/n/t/etc
# stay as choose-tree commands, while M-<letter> jumps straight to an item.
# -O name sorts sessions/windows alphabetically by default (vs index); toggle
# in-mode with O, reverse with r.
# The -K format lives in a user option so the three bindings below share one
# copy. #{E:} expands it twice: once to pull the option's text out, once to
# evaluate the #{line} arithmetic per row while the chooser is open.
set -g @choose-alt-keys "#{?#{e|<:#{line},26},M-#{a:#{e|+:#{line},97}},#{?#{e|<:#{line},52},M-#{a:#{e|+:#{line},39}},}}"
bind s choose-tree -Zs -NN -O name -K "#{E:@choose-alt-keys}"
bind w choose-tree -Zw -O name -K "#{E:@choose-alt-keys}"

# Click the session name in the status line for the same session chooser as
# prefix s — status-left is the [#S] label, so the click target is exactly it.
# MouseDown1StatusLeft is unbound by default; right-click there keeps tmux's
# built-in session menu (MouseDown3StatusLeft), which this leaves alone.
bind -n MouseDown1StatusLeft choose-tree -Zs -NN -O name -K "#{E:@choose-alt-keys}"

# copy-selection (no pipe) + set-clipboard on => tmux emits OSC 52 to the
# outer terminal, so the selection lands in the *local* Mac clipboard whether
# tmux runs locally or on a remote SSH host. No pbcopy/xclip needed.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi Enter send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# --- theme: dark/light, selected from ~/.config/isg/theme ---
# All colored styles live in tmux/theme-{dark,light}.conf (incl. status-left,
# whose prefix `*` color is theme-specific). if-shell picks one at load; after
# toggle_theme.sh flips the mode file, re-source ~/.tmux.conf to repaint.
# Prefix indicator: a bold * is appended after the session name's ] while tmux
# waits for the next key; it eats one trailing space so the list never shifts.
# default status-left-length is 10, which truncates longer session names; raise
# it so the gap before window 1 survives (not theme-dependent, kept here).
set -g status-left-length 40
# Right side: keep tmux's default pane-title display, only swap the date to
# ISO style (matches nvim <leader>nt, without seconds). status-left is untouched.
set -g status-right-length 60
set -g status-right "\"#{=21:pane_title}\" isg %Y-%m-%d %H:%M %z"
set -g status-interval 5
# Window list: current window marked *, last-chosen window (prefix l) marked ~.
set -g window-status-current-format "#I:#W*"
set -g window-status-format         "#I:#W#{?window_last_flag,~,}"
# Resolved and applied inside one run-shell script rather than a bare
# $ISGRC expansion: tmux's own global environment is captured once at
# server start and never gets zsh's `export ISGRC` (that only lives in
# interactive shells), so `source-file "$ISGRC/..."` here silently
# no-ops ("No such file or directory: /tmux/theme-dark.conf") — at server
# start AND on every toggle_theme.sh re-source, which is why the theme never
# actually applied. Deriving the repo root from ~/.tmux.conf's own symlink
# target sidesteps the missing variable entirely.
run-shell 'dots="$(cd "$(dirname "$(readlink "$HOME/.tmux.conf")")/.." && pwd)"; \
  mode="$(cat "${XDG_CONFIG_HOME:-$HOME/.config}/isg/theme" 2>/dev/null)"; \
  [ "$mode" = dark ] || mode=light; \
  tmux source-file "$dots/tmux/theme-$mode.conf"'

# --- fzf colours for anything tmux spawns ---
# fzf reads its palette from fzf/opts-active.conf at launch, found via
# $FZF_DEFAULT_OPTS_FILE. zsh/.zshenv exports that for every zsh, which already
# covers display-popup (it uses default-shell), but run-shell uses plain `sh` and
# reads no rc file at all — so put the path in the server environment too. Unlike
# a colour string, a constant path can't go stale, which is the whole point.
# The unset matters as much: any FZF_DEFAULT_OPTS the server captured at start is
# applied *after* the options file and would override it with whatever mode was
# current when the server booted — that is exactly why ~/omni's pickers stayed
# dark after a toggle to light.
run-shell 'dots="$(cd "$(dirname "$(readlink "$HOME/.tmux.conf")")/.." && pwd)"; \
  tmux set-environment -gu FZF_DEFAULT_OPTS; \
  if [ -r "$dots/fzf/opts-active.conf" ]; then \
    tmux set-environment -g FZF_DEFAULT_OPTS_FILE "$dots/fzf/opts-active.conf"; \
  else \
    tmux set-environment -gu FZF_DEFAULT_OPTS_FILE; \
  fi'

# --- plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Per-socket resurrect state: servers on different sockets (tmux -L name) save
# and restore independently instead of sharing one `last` file and clobbering
# each other. resurrect_dir() (its helpers.sh) only expands $HOME/$HOSTNAME/~,
# not tmux formats, so bake the socket name in here via run-shell — which does
# expand #{...}. #{b:socket_path} is the socket basename (`default`, or the
# `tmux -L name`). Set before any save/restore is triggered.
run 'tmux set -g @resurrect-dir "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/resurrect/#{b:socket_path}"'
# orchbus: prefix o -> cockpit popup to triage/approve all Claude Code sessions
# from one window (scans panes running `claude`, acts via send-keys).
# https://github.com/isdg/orchbus
set -g @plugin 'isdg/orchbus'
# omni: prefix b/a/P/j -> fzf-backed window jump, content search, and pane
# scrollback capture (into less/nvim).
# https://github.com/isdg/omni
set -g @plugin 'isdg/omni'

run '~/.tmux/plugins/tpm/tpm'

# --- pane navigation: Emacs motion keys ---
# prefix F/B/N/P -> right/left/down/up, mirroring the C-f/C-b/C-n/C-p cluster
# Emacs uses for character and line motion. Capitals rather than Emacs' literal
# lowercase keys because all four lowercase ones are taken and worth keeping:
# b is omni's window jump, n/p are previous/next-window above, f is find-window.
# -r makes them repeatable within repeat-time, so prefix F F F walks right.
# Placed after tpm on purpose — P is omni's, so this needs the last word — and
# before russian.sh, so all four pick up their Cyrillic twins like everything
# else.
bind -r F select-pane -R
bind -r B select-pane -L
bind -r N select-pane -D
bind -r P select-pane -U

# --- omni keys ---
# omni.tmux binds nothing any more; every key it used to own is declared here, so
# one file holds every binding and a plugin update can't move a key under us.
# The capture family is regrouped onto one letter: j (nvim), J (plain) and M-j
# (less, which lost P to pane-up above). russian.sh twins single Latin letters
# only, so M-j is skipped — correct, since terminals derive meta combinations
# from the physical key under either layout.
# Still after tpm and before russian.sh: not to win an override any more, but so
# the Cyrillic sweep runs once these exist.
# $OMNI is resolved the way omni.tmux did it — .tmux.conf cannot see that var,
# and the plugin still owns the self-heal build that puts the binary there.
run-shell 'OMNI="$(command -v omni || echo "$HOME/.cargo/bin/omni")"; \
  tmux bind-key b display-popup -E -w 90% -h 100% "$OMNI windows"; \
  tmux bind-key a display-popup -E -w 90% -h 100% "$OMNI content"; \
  tmux bind-key A display-popup -E -w 90% -h 100% "$OMNI content --history"; \
  tmux bind-key j run-shell "$OMNI capture --pager nvim"; \
  tmux bind-key J run-shell "$OMNI capture --pager plain"; \
  tmux bind-key M-j run-shell "$OMNI capture --pager less"'

# --- orchbus keys ---
# Same deal as omni: orchbus.tmux binds nothing, the keys are declared here.
# On Alt rather than bare o/O, so prefix o goes back to tmux's own pane cycling
# (restored explicitly below — a re-source cannot bring a default back on a
# server where it was already overwritten). M-o costs tmux's rotate-window -D,
# which this trades away knowingly; M-O was unbound.
# M-o opens the cockpit as an ephemeral popup, M-O as a window that persists.
# Skipped by russian.sh like M-j, and for the same reason.
run-shell 'ORCHBUS="$(command -v orchbus || echo "$HOME/.cargo/bin/orchbus")"; \
  tmux bind-key M-o display-popup -E -w 100% -h 100% "$ORCHBUS ui"; \
  tmux bind-key M-O run-shell "$ORCHBUS open"'
bind o select-pane -t :.+

# --- Russian layout ---
# Twin every prefix-<letter> and copy-mode-vi letter binding onto its Cyrillic
# key, the way lmap() does for <leader> in nvim. Last on purpose: it copies
# whatever is bound at this point, so it has to run after tpm has loaded the
# plugins' keys. See tmux/russian.sh for what it skips and why.
run-shell 'dots="$(cd "$(dirname "$(readlink "$HOME/.tmux.conf")")/.." && pwd)"; \
  sh "$dots/tmux/russian.sh"'
