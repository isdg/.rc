set -g mouse on
set -g history-limit 100000

# Truecolor passthrough: without this tmux quantizes 24-bit color to its
# 256-palette, shifting vim/bat hex colors (most visible in fzf previews).
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# Let escape sequences reach the outer terminal instead of tmux answering them
# itself. Needed for terminal background-colour detection: CLIs like gh/glamour
# query OSC 11 to pick a light/dark theme; with passthrough off tmux replies with
# its own (dark) default, so gh renders dark in a light terminal. On = the query
# reaches Ghostty and auto-detection works (also enables image protocols).
set -g allow-passthrough on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Auto window names: bare command by default, but append the open file ONLY for
# (n)vim, so buffers are distinguishable (nvim:init.lua, nvim:.tmux.conf) while
# shells etc. stay bare (zsh, claude). nvim publishes its current filename as the
# pane title (set title + titlestring=%t, see nvim options.lua), which tmux reads
# as #{pane_title}. #{m:*vim,...} matches vim/nvim/gvim; #{?cond,then,else} picks.
setw -g automatic-rename-format '#{pane_current_command}#{?#{m:*vim,#{pane_current_command}},:#{pane_title},}'

setw -g mode-keys vi
set -g set-clipboard on
# Advertise OSC 52 clipboard support for every terminal so tmux emits it on
# copy (Ghostty handles it locally and over SSH). Without this tmux won't send
# OSC 52 unless the attached terminal's terminfo declares the Ms capability.
set -as terminal-features ',*:clipboard'

# --- command aliases ---
# Names for the command shapes this file repeats, so a change lands in one
# place. command-alias is an array with six built-in entries at 0-5
# (split-pane=split-window, splitp, server-info=…) — start at 100 or you
# overwrite them. From a shell the subscript needs quoting (set -s
# 'command-alias[100]' …) or zsh globs it; inside this file it does not.
#
# These expand when a binding is *created*, not when it runs: list-keys shows
# the full command afterwards, and editing an alias later does not reach
# bindings already made. So this is one place to edit in the source, not
# runtime indirection — unlike @choose-alt-keys below, which #{E:} re-evaluates
# per row every time a chooser opens.
#
# Named by where the new pane lands, deliberately: tmux's -h/-v name the axis
# the split cuts and vim's :vsplit/:split name the divider, so the letters read
# inverted (see the splits table at the bottom). "right" and "down" cannot.
set -s command-alias[100] 'split-right=split-window -h -c "#{pane_current_path}"'
set -s command-alias[101] 'split-down=split-window -v -c "#{pane_current_path}"'
set -s command-alias[102] 'sessions=choose-tree -Zs -O name -K "#{E:@choose-alt-keys}"'
set -s command-alias[103] 'windows=choose-tree -Zw -O name -K "#{E:@choose-alt-keys}"'

bind & if-shell -F "#{==:#{window_index},1}" \
  "kill-window" \
  "select-window -t :- ; kill-window -t :+"
bind x kill-pane
bind X confirm-before -p "kill session #S? (y/n)" kill-session

bind '"' split-down
bind % split-right
bind c new-window -a -c "#{pane_current_path}"
bind C command-prompt -p "new session name:" "new-session -s '%%' -c '~'"

bind n previous-window
bind p next-window

# prefix z: zen mode — hide the status bar for a distraction-free pane; prefix z
# again brings it back. `set -g status` with no value toggles the flag (tmux
# omits the value for boolean options). status is a session option, so zen
# applies to every window of the session, and it survives a theme re-source
# because .tmux.conf never sets `status` itself — only its styles.
# Zoom moves off z to Z, since zen wants the shorter key.
bind z set -g status
bind Z resize-pane -Z

# prefix r / prefix R: rename window / pane title. `r` is a shorter alias for the
# default `,` (rename-window); it turns off automatic-rename for that window so
# the manual name sticks. `R` sets pane_title, which feeds automatic-rename-format
# and status-right. Both prefill the current name so it's an edit, not a retype.
# For (n)vim panes the editor keeps rewriting pane_title, so `R` is most useful
# for shells/REPLs.
bind r command-prompt -I "#{window_name}" -p "window name:" "rename-window '%%'"
bind R command-prompt -I "#{pane_title}" -p "pane title:" "select-pane -T '%%'"

# prefix s / prefix w: choose-tree with Alt-letter fast-access. -K maps #{line}
# (0-based row) to M-a..M-z, then M-A..M-Z past 26 (52 total). Using the Alt
# modifier means zero clashes: plain h/j/k/l still navigate and x/f/m/n/t/etc
# stay as choose-tree commands, while M-<letter> jumps straight to an item.
# -O name sorts sessions/windows alphabetically by default (vs index); toggle
# in-mode with O, reverse with r.
# No -N anywhere: the flag means "start without the preview", and *given twice*
# means the larger one — prefix s used to carry -NN and so opened with the big
# preview while prefix w opened with the small one. Bare is tmux's default, the
# small preview, and now both agree. v still toggles it per invocation.
# The -K format lives in a user option so the three bindings below share one
# copy. #{E:} expands it twice: once to pull the option's text out, once to
# evaluate the #{line} arithmetic per row while the chooser is open.
set -g @choose-alt-keys "#{?#{e|<:#{line},26},M-#{a:#{e|+:#{line},97}},#{?#{e|<:#{line},52},M-#{a:#{e|+:#{line},39}},}}"
bind s sessions
bind w windows

# Click the session name in the status line for the same session chooser as
# prefix s — status-left is the [#S] label, so the click target is exactly it.
# MouseDown1StatusLeft is unbound by default; right-click there keeps tmux's
# built-in session menu (MouseDown3StatusLeft), which this leaves alone.
bind -n MouseDown1StatusLeft sessions

# copy-selection (no pipe) + set-clipboard on => tmux emits OSC 52 to the
# outer terminal, so the selection lands in the *local* Mac clipboard whether
# tmux runs locally or on a remote SSH host. No pbcopy/xclip needed.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-no-clear
bind -T copy-mode-vi Enter send -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# --- scrollback: homerow, always the ACTIVE pane ---
# The wheel cannot do this. tmux resolves mouse keys against the pane under the
# *pointer*, so in a split it scrolls whichever pane the mouse is parked over
# rather than the one you are typing in — and nothing at all when the pointer
# sits outside the window. Every key below targets the active pane instead:
# copy-mode and `send -X` default to it, and no pointer is consulted.
#
# prefix e enters copy-mode already scrolled to the bottom, a one-handed alias
# for the default prefix [ which stays bound. -e is what makes it a *scroll*
# affordance rather than a *copy* one: scrolling back down past the last line
# drops you out to the shell, so reading a few screens back costs e, some k,
# some j — and never a q.
bind e copy-mode -e

# Half-page on bare d/u, matching vim's C-d/C-u without the reach. Both letters
# were unbound in copy-mode-vi (only the Ctrl pair existed), so this adds keys
# without taking any: j/k stay cursor motion, which is what a selection needs
# (v then j), and J/K + C-e/C-y remain the line-at-a-time view scrolls.
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi u send -X halfpage-up

# --- theme: dark/light, selected from ~/.config/isg/theme ---
# All colored styles live in tmux/theme-{dark,light}.conf (incl. status-left,
# whose prefix `*` color is theme-specific). if-shell picks one at load; after
# toggle_theme.sh flips the mode file, re-source ~/.tmux.conf to repaint.
# Prefix indicator: a bold * is appended after the session name's ] while tmux
# waits for the next key; it eats one trailing space so the list never shifts.
# default status-left-length is 10, which truncates longer session names; raise
# it so the gap before window 1 survives (not theme-dependent, kept here).
set -g status-left-length 40
# Right side: keep tmux's default pane-title display, only swap the date to
# ISO style (matches nvim <leader>nt, without seconds). status-left is untouched.
set -g status-right-length 60
set -g status-right "\"#{=21:pane_title}\" isg %Y-%m-%d %H:%M %z"
set -g status-interval 5
# Window list: current window marked *, last-chosen window (prefix l) marked ~.
set -g window-status-current-format "#I:#W*"
set -g window-status-format         "#I:#W#{?window_last_flag,~,}"
# Resolved and applied inside one run-shell script rather than a bare
# $ISGRC expansion: tmux's own global environment is captured once at
# server start and never gets zsh's `export ISGRC` (that only lives in
# interactive shells), so `source-file "$ISGRC/..."` here silently
# no-ops ("No such file or directory: /tmux/theme-dark.conf") — at server
# start AND on every toggle_theme.sh re-source, which is why the theme never
# actually applied. Deriving the repo root from ~/.tmux.conf's own symlink
# target sidesteps the missing variable entirely.
run-shell 'dots="$(cd "$(dirname "$(readlink "$HOME/.tmux.conf")")/.." && pwd)"; \
  mode="$(cat "${XDG_CONFIG_HOME:-$HOME/.config}/isg/theme" 2>/dev/null)"; \
  [ "$mode" = dark ] || mode=light; \
  tmux source-file "$dots/tmux/theme-$mode.conf"'

# --- fzf colours for anything tmux spawns ---
# fzf reads its palette from fzf/opts-active.conf at launch, found via
# $FZF_DEFAULT_OPTS_FILE. zsh/.zshenv exports that for every zsh, which already
# covers display-popup (it uses default-shell), but run-shell uses plain `sh` and
# reads no rc file at all — so put the path in the server environment too. Unlike
# a colour string, a constant path can't go stale, which is the whole point.
# The unset matters as much: any FZF_DEFAULT_OPTS the server captured at start is
# applied *after* the options file and would override it with whatever mode was
# current when the server booted — that is exactly why ~/omni's pickers stayed
# dark after a toggle to light.
run-shell 'dots="$(cd "$(dirname "$(readlink "$HOME/.tmux.conf")")/.." && pwd)"; \
  tmux set-environment -gu FZF_DEFAULT_OPTS; \
  if [ -r "$dots/fzf/opts-active.conf" ]; then \
    tmux set-environment -g FZF_DEFAULT_OPTS_FILE "$dots/fzf/opts-active.conf"; \
  else \
    tmux set-environment -gu FZF_DEFAULT_OPTS_FILE; \
  fi'

# --- plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Per-socket resurrect state: servers on different sockets (tmux -L name) save
# and restore independently instead of sharing one `last` file and clobbering
# each other. resurrect_dir() (its helpers.sh) only expands $HOME/$HOSTNAME/~,
# not tmux formats, so bake the socket name in here via run-shell — which does
# expand #{...}. #{b:socket_path} is the socket basename (`default`, or the
# `tmux -L name`). Set before any save/restore is triggered.
run 'tmux set -g @resurrect-dir "${XDG_DATA_HOME:-$HOME/.local/share}/tmux/resurrect/#{b:socket_path}"'
# orchbus: prefix o -> cockpit popup to triage/approve all Claude Code sessions
# from one window (scans panes running `claude`, acts via send-keys).
# https://github.com/isdg/orchbus
set -g @plugin 'isdg/orchbus'
# omni: prefix b/a/P/j -> fzf-backed window jump, content search, and pane
# scrollback capture (into less/nvim).
# https://github.com/isdg/omni
set -g @plugin 'isdg/omni'

run '~/.tmux/plugins/tpm/tpm'

# --- omni keys ---
# omni.tmux binds nothing any more; every key it used to own is declared here, so
# one file holds every binding and a plugin update can't move a key under us.
# The capture family: j (nvim), J (plain), and p in the second layer for the
# less pager — p for pager, since j there is vim's down.
# Still after tpm and before russian.sh: not to win an override any more, but so
# the Cyrillic sweep runs once these exist.
# $OMNI is resolved the way omni.tmux did it — .tmux.conf cannot see that var,
# and the plugin still owns the self-heal build that puts the binary there.
run-shell 'OMNI="$(command -v omni || echo "$HOME/.cargo/bin/omni")"; \
  tmux bind-key b display-popup -E -w 90% -h 100% "$OMNI windows"; \
  tmux bind-key a display-popup -E -w 90% -h 100% "$OMNI content"; \
  tmux bind-key A display-popup -E -w 90% -h 100% "$OMNI content --history"; \
  tmux bind-key j run-shell "$OMNI capture --pager nvim"; \
  tmux bind-key J run-shell "$OMNI capture --pager plain"; \
  tmux bind-key -T plugins p run-shell "$OMNI capture --pager less"'

# --- second layer: prefix prefix ---
# C-b C-b enters the `plugins` key table — a second layer whose plain letters run
# the plugin entry points, keeping them out of the crowded top level.
#
# Alt was the alternative and it loses twice: in the root table apps rewrite it
# (nvim/readline/fzf all claim M-o and M-j), and in the prefix table it works but
# is invisible — tmux only learns a modifier once a whole key arrives, so there
# is no "prefix + Alt held" state to render. A key table is durable state, so
# #{client_key_table} drives the `+` in status-left the way client_prefix drives
# the `*`. That is the whole reason this shape was chosen.
#
# The key spent is send-prefix (a literal C-b for a nested tmux over SSH), so it
# moves inside the layer: C-b C-b C-b sends it.
bind C-b switch-client -T plugins
bind -T plugins C-b send-prefix

# Pane navigation lives here, as plain vim hjkl. Lowercase is only possible
# because the layer has its own namespace: at the top level h is a stacked
# split, j is omni's capture, l is last-window and k is unbound.
# These deliberately do NOT re-enter the table. You almost always hop in order
# to type in the pane you land on, and a sticky hop eats that first keystroke:
# tmux would still own the keyboard, and the key that finally exits the table is
# consumed doing so rather than reaching nvim. One hop, then out.
# Walking several panes is what the default prefix arrows are for — they carry
# -r, so C-b Up Up Up repeats inside repeat-time.
bind -T plugins h select-pane -L
bind -T plugins j select-pane -D
bind -T plugins k select-pane -U
bind -T plugins l select-pane -R

# Resize is where staying in the table earns its keep: it is inherently
# repetitive, and you are not trying to type afterwards. Capitals, so the shift
# key reads as "change the pane" against lowercase "go to the pane", and each
# one re-enters so H H H keeps pulling the border. Escape or q drops out; any
# unbound key also exits, but is swallowed doing it, so the explicit pair is
# what keeps that from being a surprise.
# One column/row per press: staying in the table is what makes a step of 1
# practical, since holding the key walks the border smoothly instead of
# jumping in fives. prefix M-arrow keeps the coarse 5 for a single big nudge.
bind -T plugins H resize-pane -L \; switch-client -T plugins
bind -T plugins J resize-pane -D \; switch-client -T plugins
bind -T plugins K resize-pane -U \; switch-client -T plugins
bind -T plugins L resize-pane -R \; switch-client -T plugins

# E undoes all of the above, so it belongs with them rather than at the top
# level where it started: HJKL is the whole reason you need an equalize, and
# reaching it used to mean leaving the table and pressing the prefix again.
# Re-enters for the same reason the resize keys do — E is most often the first
# press of a fresh round of HJKL, not the last press of the old one.
# Its old home, prefix E, is unbound just below; У goes with it, since
# russian.sh twins whatever is bound when it runs and cannot remove what a
# server bound before this moved (the same reason prefix Щ is spelt out).
bind -T plugins E select-layout -E \; switch-client -T plugins
unbind E
unbind У

# Third tier on the same letters: move the pane itself rather than the focus or
# the border. C-hjkl, so the whole family reads down one column — h goes to a
# pane, H grows toward it, C-h drags the pane there.
#
# tmux has no "move pane" verb; swap-pane is the entire vocabulary, and a swap
# leaves the active pane pinned to the old *position*, now holding whatever was
# swapped in. So the pane you meant to move slides out from under you and you
# are suddenly driving its neighbour. The select-pane is what turns the swap
# back into a move: it runs before anything has moved the cursor, so {left-of}
# still resolves from the unchanged position and now names the pane that just
# travelled there. Both halves must use the same direction word for that to hold.
#
# Directional targets wrap at the edges (tmux's own behaviour, same as
# select-pane -L), so pushing left from the leftmost pane sends it to the far
# right instead of erroring — which is exactly the swap you want in a 2-pane
# split, and harmless anywhere else since one press the other way undoes it.
# Re-enters the table like the resize keys: a pane rarely lands in one press.
bind -T plugins C-h swap-pane -t '{left-of}'  \; select-pane -t '{left-of}'  \; switch-client -T plugins
bind -T plugins C-j swap-pane -t '{down-of}'  \; select-pane -t '{down-of}'  \; switch-client -T plugins
bind -T plugins C-k swap-pane -t '{up-of}'    \; select-pane -t '{up-of}'    \; switch-client -T plugins
bind -T plugins C-l swap-pane -t '{right-of}' \; select-pane -t '{right-of}' \; switch-client -T plugins

# C-b C-b m / M: move a pane across windows or sessions, choosing the other end
# from a picker instead of aiming at it.
#
# The C-h/C-j/C-k/C-l keys above only shuffle panes inside one window. Crossing
# a window or session boundary is join-pane, which needs a target — and
# choose-tree supplies one: given a trailing template it substitutes the chosen
# item for %%, so the tree already used for navigation doubles as a target
# picker. The alternative tmux offers is select-pane -m plus manual navigation,
# which is worth it only when you want to stage a move for later; for "this one,
# there, now" the picker is two keystrokes with the M-<letter> shortcuts.
#
# Both show the whole tree — neither -s nor -w — because what you pick decides
# what happens. There is no flag for "panes": they are what is left visible when
# nothing is collapsed.
#
# m pulls: the pane you pick comes here as a split.
#
# M pushes, and splitting is only right when you aimed at a pane. Aim at a
# window or a session and you meant "put it over there", not "wedge it into
# whatever is open there" — so those break it out into a new window instead.
# The three targets are told apart by the shape choose-tree substitutes:
#   session  =beta:           window  =alpha:2.         pane  =alpha:2.%2
# so "ends with .%something" is the pane test, and everything else is a
# container. %1 rather than %% for the substitution: %% replaces only its FIRST
# occurrence, %1 replaces every one, and the template names the target three
# times. The %* in the pattern is left alone, being neither token.
#
# break-pane needs -a: against a window target plain -t fails with "index in
# use", since the index is taken by the window you just pointed at. -a puts the
# new window after it, and is accepted for a session target too, so one branch
# covers both. -d leaves you where you are, matching join-pane -t — a push
# sends the pane away, it does not take you along.
#
# Neither re-enters the table: the move is one action, unlike a resize.
# Deliberately not command-aliased — the aliases at the top of this file each
# stand in for three or four copies, and these are one use apiece.
bind -T plugins m choose-tree -Z -O name -K "#{E:@choose-alt-keys}" "join-pane -s '%%'"
bind -T plugins M choose-tree -Z -O name -K "#{E:@choose-alt-keys}" \
  "if-shell -F '#{m:*.%*,%1}' { join-pane -t '%1' } { break-pane -d -a -t '%1' }"

# C-b C-b w: write this pane's scrollback to a file.
#
# The sibling of prefix j, which shows the same text in nvim: this one leaves it
# on disk, for when the pane is about to be killed, or the output has to outlive
# the session, or something else wants to read it.
#
# capture-pane, not pipe-pane. pipe-pane tees the live stream, which sounds
# better and is not: it records raw bytes, so with zsh-syntax-highlighting every
# keystroke lands in the file as a repaint (^[[1m^[[31mp^[[1m^[[31mr… for one
# typed word) and the real output drowns. capture-pane hands over the rendered
# text instead. The cost is symmetric: pipe-pane catches everything from the
# moment it is armed, capture-pane only what history-limit still holds — 100k
# lines here, which is the larger number in every case worth caring about.
#
# -S - takes the whole history, not the visible screen. -J unwraps lines the
# terminal folded, so grepping the file finds strings the eye can see. No -e:
# colour would mean escape codes back in the file, which is the thing being
# avoided — prefix j is where colour belongs.
#
# The name is sanitised because window names hold anything automatic-rename
# puts there, and "nvim:init.lua" has a colon in it.
bind -T plugins w run-shell 'd="${XDG_CACHE_HOME:-$HOME/.cache}/tmux-panes"; mkdir -p "$d"; \
  n=$(printf "%s" "#{session_name}-#{window_name}-#{pane_index}" | tr -c "A-Za-z0-9._-" "_"); \
  f="$d/$n-$(date +%Y%m%d-%H%M%S).txt"; \
  tmux capture-pane -p -S - -J -t "#{pane_id}" > "$f"; \
  tmux display-message "saved $n ($(wc -l < "$f" | tr -d " ") lines) -> ${d/#$HOME/~}"'

bind -T plugins Escape switch-client -T root
bind -T plugins q switch-client -T root

# Splits hang off s, one level deeper: C-b C-b s v is side-by-side, C-b C-b s h
# is stacked. A third table rather than a two-key binding, because tmux keys are
# single keys — a sequence IS a table. This keeps vim's split names without
# spending any top-level key, which is why prefix v / prefix h are gone; the
# defaults % and " are untouched for the one-handed case.
# The flags read inverted against the letters and that is not a typo: tmux's
# -h/-v name the axis the split cuts along, vim's :vsplit/:split name the
# divider, so v (side-by-side, vertical divider) is -h and h (stacked) is -v.
bind -T plugins s switch-client -T splits
bind -T splits v split-right
bind -T splits h split-down

# --- orchbus keys ---
# Same deal as omni: orchbus.tmux binds nothing, the keys are declared here.
# o opens the cockpit as an ephemeral popup, O as a window that persists — at the
# top level, alongside omni's b/a/A/j/J, because the two are reached for the same
# way and equally often; splitting the pair across layers was the one thing you
# had to stop and remember.
#
# What they displace, tmux's own prefix o (cycle to the next pane), goes into the
# layer, where hjkl already are: pane navigation is what that half of the table
# is for, and cycling is the same errand by another name.
#
# The two unbinds clear the O this section used to put in the layer, and the Щ
# russian.sh twinned from it: a re-source rebinds what is listed here but cannot
# drop what is not, so on a server that has been running since before this swap
# both would survive as a second way into the cockpit. The Cyrillic key is spelt
# out rather than swept because it is the one twin whose source is gone — every
# other one still follows its Latin key automatically.
run-shell 'ORCHBUS="$(command -v orchbus || echo "$HOME/.cargo/bin/orchbus")"; \
  tmux bind-key o display-popup -E -w 100% -h 100% "$ORCHBUS ui"; \
  tmux bind-key O run-shell "$ORCHBUS open"'
bind -T plugins o select-pane -t :.+
unbind -T plugins O
unbind -T plugins Щ

# --- Russian layout ---
# Twin every prefix-<letter> and copy-mode-vi letter binding onto its Cyrillic
# key, the way lmap() does for <leader> in nvim. Last on purpose: it copies
# whatever is bound at this point, so it has to run after tpm has loaded the
# plugins' keys. See tmux/russian.sh for what it skips and why.
run-shell 'dots="$(cd "$(dirname "$(readlink "$HOME/.tmux.conf")")/.." && pwd)"; \
  sh "$dots/tmux/russian.sh"'
