# tmux dark theme — GENERATED by theme/generate.sh.
# Edit theme/palette.sh, not this file.
#
# Sourced by .tmux.conf, which reads ~/.config/isg/theme at parse time (see the
# run-shell block there). Re-source ~/.tmux.conf to repaint; toggle_theme.sh
# does that for you, which is why tmux is the one tool that flips live.
#
# Every style keeps bg=default so the terminal background shows through and the
# status line reads as part of the pane instead of a band painted over it. Don't
# give these a background — it is what keeps the layout seamless.
set -g status-style "bg=default,fg=#c0c0c0"
set -g status-left "[#S]#{?#{||:#{==:#{client_key_table},plugins},#{==:#{client_key_table},splits}},#[fg=#ffffff#,bold]+#[default] ,#{?client_prefix,#[fg=#ffffff#,bold]*#[default] ,  }}"
set -g window-status-style "bg=default,fg=#a6a6a6"
set -g window-status-current-style "bg=default,fg=#ffffff,bold"
# Alert flag (monitor-silence / -activity / -bell). tmux defaults this to
# `reverse`, which on a bg=default bar paints a filled block and reads as a
# rendering fault. Underscore instead: the palette here is greyscale, bold is
# already spoken for by the current window, and an underline is the one
# attribute left that draws the eye without inventing a colour.
set -g window-status-activity-style "bg=default,fg=#ffffff,underscore"
set -g status-left-style "bg=default,fg=#c0c0c0"
set -g status-right-style "bg=default,fg=#c0c0c0"
set -g message-style "bg=default,fg=#e6e6e6"
set -g pane-border-style "fg=#444444"
set -g pane-active-border-style "fg=#777777"
