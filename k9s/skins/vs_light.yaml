# k9s light skin — GENERATED by theme/generate.sh.
# Edit theme/palette.sh, not this file.
#
# Selected by skins/skin-active.yaml, which toggle_theme.sh flips. k9s reads it
# at launch (config.yaml sets ui.skin: skin-active; reactive is false).
#
# status.addColor and status.killColor are the terminal's own ANSI green and red
# rather than hex roles — the only two places this skin deliberately agrees with
# the ramp every other tool resolves names through.
k9s:
  body:
    fgColor: "#000000"
    bgColor: "#fafafa"
    logoColor: "#0000ff"
  prompt:
    fgColor: "#000000"
    bgColor: "#fafafa"
    suggestColor: "#0451a5"
  info:
    fgColor: "#999999"
    sectionColor: "#000000"
  dialog:
    fgColor: "#000000"
    bgColor: "#f3f3f3"
    buttonFgColor: "#ffffff"
    buttonBgColor: "#007acc"
    buttonFocusFgColor: "#ffffff"
    buttonFocusBgColor: "#0451a5"
    labelFgColor: "#0000ff"
    fieldFgColor: "#000000"
  frame:
    border:
      fgColor: "#d4d4d4"
      focusColor: "#0000ff"
    menu:
      fgColor: "#000000"
      keyColor: "#0000ff"
      numKeyColor: "#0000ff"
    crumbs:
      fgColor: "#ffffff"
      bgColor: "#0451a5"
      activeColor: "#007acc"
    status:
      newColor: "#0000ff"
      modifyColor: "#098658"
      addColor: "#40a02b"
      errorColor: "#ff0000"
      highlightColor: "#bf8803"
      killColor: "#d20f39"
      completedColor: "#999999"
    title:
      fgColor: "#000000"
      bgColor: "#fafafa"
      highlightColor: "#800000"
      counterColor: "#0000ff"
      filterColor: "#267f99"
  views:
    charts:
      bgColor: "#fafafa"
      defaultDialColors:
        - "#0000ff"
        - "#ff0000"
      defaultChartColors:
        - "#0000ff"
        - "#ff0000"
    table:
      fgColor: "#000000"
      bgColor: "#fafafa"
      cursorFgColor: "#ffffff"
      cursorBgColor: "#007acc"
      markColor: "#bf8803"
      header:
        fgColor: "#0000ff"
        bgColor: "#fafafa"
        sorterColor: "#267f99"
    xray:
      fgColor: "#000000"
      bgColor: "#fafafa"
      cursorColor: "#add6ff"
      graphicColor: "#0451a5"
      showIcons: false
    yaml:
      keyColor: "#0000ff"
      colonColor: "#999999"
      valueColor: "#a31515"
    logs:
      fgColor: "#000000"
      bgColor: "#fafafa"
      indicator:
        fgColor: "#ffffff"
        bgColor: "#007acc"
