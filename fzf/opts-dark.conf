# fzf dark options — read by every fzf on the machine via the
# opts-active.conf symlink (see zsh/.zshenv, toggle_theme.sh).
#
# The selected row (bg+/fg+) is the one colour that cannot be shared with the
# light file: a light selection (#dce7f2 with dark text) reads as a glaring
# white bar on a dark background. Each mode borrows its editor's own selection
# colours — nvim/colors/vs_dark.vim `hi Search` — so the picker matches the
# buffer underneath it. `prompt` likewise: black is invisible on dark.
#
# One option per line; `#` starts a comment only at the start of a line, so the
# hex colours below are safe. bg/fg are -1 (terminal default) on purpose: the
# terminal is already themed, and painting our own background would leave the
# popup a different shade than the pane behind it.
--preview-window=down:55%
--color=bg:-1,fg:-1,bg+:#264F78,fg+:#D4D4D4
--color=hl:bright-blue,hl+:blue
--color=header:green,info:green,pointer:blue
--color=marker:bright-blue,prompt:blue,spinner:blue
