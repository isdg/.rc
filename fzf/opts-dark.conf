# fzf dark options — GENERATED by theme/generate.sh.
# Edit theme/palette.sh, not this file.
#
# Read by every fzf on the machine through the opts-active.conf symlink
# ($FZF_DEFAULT_OPTS_FILE, see zsh/.zshenv and toggle_theme.sh) — our pickers,
# fzf-tab, nvim's fzf.vim and the tmux popups alike.
#
# One option per line; `#` starts a comment only at the start of a line, so the
# hex colours below are safe.
#
# bg/fg are -1 (terminal default) on purpose: the terminal is already themed, and
# painting our own background would leave the popup a different shade than the
# pane behind it. The selected row (bg+/fg+) is the one colour that cannot be
# shared between modes — a light selection reads as a glaring white bar on dark —
# so each mode borrows its editor's own nvim `hi Search`. `prompt` likewise:
# black is invisible on dark. Everything else is an ANSI name, which is what
# makes these two files nearly identical.
#
# M-j enters fzf's jump mode — EasyMotion-style labels over every visible row —
# and the `jump` event accepts what it lands on. Alt because the query still
# wants space and ctrl-j is fzf's `down`; it also reads like tmux's M-<letter>.
#
# Vim's scroll verbs on Alt, keeping fzf's ctrl defaults; the one key spent is
# M-d (fzf's kill-word). All four read the screen rather than the match order,
# since the list grows bottom-up: M-d/M-G go toward the prompt, M-u/M-g away
# from it — which is why M-g, the top of the screen, is spelled `last`.
--preview-window=down:55%
--bind=alt-j:jump,jump:accept
--bind=alt-d:half-page-down,alt-u:half-page-up,alt-g:last,alt-G:first
--color=bg:-1,fg:-1,bg+:#264f78,fg+:#d4d4d4
--color=hl:bright-blue,hl+:blue
--color=header:green,info:green,pointer:blue
--color=marker:bright-blue,prompt:blue,spinner:blue
