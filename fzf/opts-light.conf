# fzf light options — read by every fzf on the machine via the
# opts-active.conf symlink (see zsh/.zshenv, toggle_theme.sh).
#
# Selection colours mirror nvim/colors/vs_light.vim `hi Search`; see
# opts-dark.conf for why bg+/fg+/prompt are the only per-mode lines and why
# bg/fg stay at the terminal default (-1).
--preview-window=down:55%
--color=bg:-1,fg:-1,bg+:#dce7f2,fg+:bright-black
--color=hl:bright-blue,hl+:blue
--color=header:green,info:green,pointer:blue
--color=marker:bright-blue,prompt:black,spinner:blue
